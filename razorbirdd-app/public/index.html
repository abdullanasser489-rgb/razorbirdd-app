<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Spine — local</title>
<style>
:root{--bg:#0a0906;--pan:#12100a;--pan2:#171309;--line:rgba(238,170,0,.12);--fg:#e8d9a8;--strong:#fff6dd;--mu:#9a8a63;--gr:#eeaa00;--am:#ffc21a;--bad:#ff6f61}
*{box-sizing:border-box}
body{margin:0;padding:0 0 60px;background:var(--bg);color:var(--fg);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header{padding:16px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wm{font-family:Didot,"Bodoni MT",Playfair Display,serif;font-style:italic;text-transform:uppercase;letter-spacing:.045em;color:var(--gr);font-size:14px}
h1{font-size:22px;margin:14px 0 0;color:var(--strong);font-weight:600}
h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:26px 0 9px;font-weight:700}
p.sub{margin:6px 0 0;font-size:12.5px;color:var(--mu)}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--strong);background:#12100a;border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gr);outline-offset:1px;border-color:transparent}
textarea{width:100%;min-height:80px;resize:vertical}
label.f{display:block;font-size:11.5px;color:var(--mu);margin:10px 0 5px}
button{font:inherit;font-weight:600;font-size:12.5px;min-height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--pan2);color:var(--fg);cursor:pointer}
button:hover{border-color:rgba(238,170,0,.45);color:var(--strong)}
button.go{background:var(--gr);border-color:var(--gr);color:#1a1200}
button.am{background:var(--am);border-color:var(--am);color:#1a1200}
button.gh{background:none;color:var(--mu)}
.meter{border:1px solid rgba(238,170,0,.24);border-radius:14px;padding:14px;background:linear-gradient(180deg,rgba(238,170,0,.08),rgba(238,170,0,.02))}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mrow b{font-size:19px;color:var(--strong);font-variant-numeric:tabular-nums}
.mrow span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:700}
.track{margin-top:9px;height:7px;border-radius:999px;background:rgba(238,170,0,.15);overflow:hidden}
.track>i{display:block;height:100%;background:linear-gradient(90deg,#b57e00,var(--gr))}
.tools{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.tools{grid-template-columns:1fr 1fr}}
.tool{border:1px solid var(--line);border-radius:13px;background:var(--pan);padding:12px}
.tool h3{margin:0;font-size:14px;color:var(--strong)}
.tool .m{margin-top:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--mu)}
.pill{display:inline-block;padding:2px 7px;border-radius:999px;border:1px solid rgba(255,194,26,.4);color:var(--am);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--fg)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.err{color:#ffb4ac;font-size:12.5px;margin-top:8px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;white-space:pre-wrap;color:var(--fg);background:#12100a;border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:9px}
.hint{font-size:11.5px;color:var(--mu);margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ------------------------------------------------------------------ api */
const api = async (method, args = {}) => {
  const res = await fetch("/rpc", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ method, args }),
  });
  let data;
  try { data = await res.json(); } catch { throw new Error("The server did not return JSON — is /rpc reaching the Worker?"); }
  if (!data.ok) throw new Error(data.error || "Request failed");
  return data.result;
};

/* ----------------------------------------------------------------- ui kit */
const $ = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};
const clear = (el) => { while (el.firstChild) el.removeChild(el.firstChild); };
const fmt = (n) => Number(n || 0).toLocaleString("en-US");
const app = () => document.getElementById("app");
const fail = (e) => { const m = document.getElementById("msg"); if (m) { m.className = "err"; m.textContent = e?.message || String(e); } };

/* --------------------------------------------------------------- session */
let token = sessionStorage.getItem("spine.token") || null;
let me = null, tools = [], projects = [];

const setToken = (t) => { token = t; if (t) sessionStorage.setItem("spine.token", t); else sessionStorage.removeItem("spine.token"); };

async function refresh() {
  me = await api("me", { token });
  tools = await api("tools", { token });
  projects = await api("listProjects", { token });
  render();
}

/* ------------------------------------------------------------------ auth */
function checkEmail(raw) {
  const shown = String(raw ?? ""), email = shown.trim().toLowerCase();
  if (!email) return { error: "Enter your email address." };
  if (/\s/.test(email)) return { error: `"${shown}" has a space in it.` };
  const at = email.indexOf("@");
  if (at < 0) return { error: `"${email}" is missing an @ — for example you@example.com.` };
  if (email.indexOf("@", at + 1) !== -1) return { error: `"${email}" has more than one @.` };
  const domain = email.slice(at + 1);
  if (!domain.includes(".")) return { error: `"${domain}" is missing a dot — for example example.com.` };
  if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) return { error: `"${email}" does not look like an email address.` };
  return { email };
}

function renderAuth(mode = "signup") {
  const root = app(); clear(root);
  root.append(
    $("header", {}, $("div", { class: "wm", text: "Razorbirdd spine" }), $("span", { style: "font-size:12px;color:var(--mu)", text: "local" })),
    $("h1", { text: "Sign in" }),
    $("p", { class: "sub", text: "Auth, bucket, router and ledger — running on your laptop. Data lives in .wrangler/state." }),
    $("div", { class: "card", style: "margin-top:16px" },
      $("div", { class: "row" },
        $("button", { class: mode === "signup" ? "go" : "gh", text: "Create account", onclick: () => renderAuth("signup") }),
        $("button", { class: mode === "signin" ? "go" : "gh", text: "Sign in", onclick: () => renderAuth("signin") }),
      ),
      mode === "signup" ? $("label", { class: "f", text: "Display name" }) : null,
      mode === "signup" ? $("input", { id: "name", placeholder: "rae_molina", style: "width:100%", value: "rae_molina" }) : null,
      $("label", { class: "f", text: "Email" }),
      $("input", { id: "email", type: "email", placeholder: "rae@example.com", style: "width:100%", value: "rae@example.com" }),
      $("label", { class: "f", text: "Password (10+ characters)" }),
      $("input", { id: "password", type: "password", style: "width:100%", value: "correct-horse-battery" }),
      mode === "signup" ? $("div", { class: "row", style: "margin-top:10px" },
        $("label", { class: "f", text: "Plan", style: "margin:0" }),
        $("select", { id: "plan" },
          $("option", { value: "founder", text: "Founder — 10M weighted tokens" }),
          $("option", { value: "free", text: "Free — no tokens, text only" }),
        )) : null,
      $("div", { class: "row", style: "margin-top:12px" },
        $("button", {
          class: "go",
          text: mode === "signup" ? "Create account" : "Sign in",
          onclick: async () => {
            const msg = document.getElementById("msg");
            const checked = checkEmail(document.getElementById("email").value);
            if (checked.error) { msg.className = "err"; msg.textContent = checked.error; return; }
            const password = document.getElementById("password").value;
            if (password.length < 10) { msg.className = "err"; msg.textContent = "Use at least 10 characters for the password."; return; }
            msg.textContent = "";
            try {
              const res = mode === "signup"
                ? await api("signup", { email: checked.email, password, name: document.getElementById("name").value, plan: document.getElementById("plan").value })
                : await api("signin", { email: checked.email, password });
              setToken(res.token);
              await refresh();
            } catch (e) { fail(e); }
          },
        }),
      ),
      $("div", { id: "msg" }),
    ),
  );
}

/* -------------------------------------------------------------- dashboard */
function render() {
  const root = app(); clear(root);
  const pct = me.pool ? Math.min(100, (me.used / me.pool) * 100) : 100;

  root.append(
    $("header", {},
      $("div", { class: "wm", text: "Razorbirdd spine" }),
      $("div", { class: "row" },
        $("span", { style: "font-size:12px;color:var(--mu)", text: `${me.name} · ${me.plan}` }),
        $("button", { class: "gh", text: "Sign out", onclick: async () => {
          try { await api("signout", { token }); } catch {}
          setToken(null); renderAuth("signin");
        } }),
      ),
    ),
    $("h1", { text: "Toolbox" }),

    $("div", { class: "meter", style: "margin-top:14px" },
      $("div", { class: "mrow" }, $("span", { text: "Weighted tokens used" }), $("b", { text: `${fmt(me.used)} of ${fmt(me.pool)}` })),
      $("div", { class: "track" }, $("i", { style: `width:${pct}%` })),
      $("div", { class: "mrow", style: "margin-top:9px" },
        $("span", { text: `${fmt(me.remaining)} remaining · bucket ${fmt(me.usedBytes)} of ${fmt(me.quotaBytes)} bytes` }),
        me.remaining === 0
          ? $("button", { class: "am", text: "Top up $10 · 5M", onclick: async () => {
              try { await api("topUp", { token }); await refresh(); } catch (e) { fail(e); }
            } })
          : null,
      ),
      $("div", { id: "msg" }),
    ),

    $("h2", { text: "Tools — swap any model" }),
    $("div", { class: "tools" }, ...tools.map((t) => $("div", { class: "tool" },
      $("h3", { text: t.label }),
      $("div", { class: "m" },
        $("span", { text: "model" }),
        $("select", {
          onchange: async (e) => {
            try { await api("setToolModel", { token, tool: t.tool, model: e.target.value }); await refresh(); } catch (err) { fail(err); }
          },
        }, ...t.models.map((m) => $("option", { value: m.id, text: `${m.label} (w${m.weight})${m.up ? "" : " — down"}`, ...(m.id === t.model ? { selected: "selected" } : {}) }))),
        t.swapped ? $("span", { class: "pill", text: "swapped" }) : null,
      ),
    ))),

    $("h2", { text: "Run something" }),
    $("div", { class: "card" },
      $("div", { class: "row" },
        $("select", { id: "tool" }, ...tools.map((t) => $("option", { value: t.tool, text: t.label }))),
        $("select", { id: "project" },
          $("option", { value: "", text: "No project" }),
          ...projects.map((p) => $("option", { value: p.id, text: p.title })),
        ),
      ),
      $("label", { class: "f", text: "Prompt" }),
      $("textarea", { id: "prompt", placeholder: "Summarise this thread for the council…" }),
      $("div", { class: "row", style: "margin-top:10px" },
        $("button", { class: "go", text: "Run", onclick: runJob }),
        $("button", { class: "gh", text: "New project", onclick: newProject }),
        $("button", { class: "gh", text: "Take GLM down", onclick: async () => {
          try { await api("setHealth", { model: "glm-5.3", up: false }); fail({ message: "GLM 5.3 is now down — run Code and watch the fallback line." }); } catch (e) { fail(e); }
        } }),
        $("button", { class: "gh", text: "Bring GLM back", onclick: async () => {
          try { await api("setHealth", { model: "glm-5.3", up: true }); await refresh(); } catch (e) { fail(e); }
        } }),
      ),
      $("div", { id: "out" }),
      $("div", { id: "msg" }),
    ),

    $("h2", { text: "Bucket — my projects" }),
    $("div", { class: "card" },
      projects.length
        ? $("table", {},
            $("tr", {}, $("th", { text: "Project" }), $("th", { text: "Tool" }), $("th", { text: "Model" }), $("th", { class: "n", text: "Bytes" }), $("th", {})),
            ...projects.map((p) => $("tr", {},
              $("td", { text: p.title }),
              $("td", { text: p.tool }),
              $("td", { text: p.model || "default" }),
              $("td", { class: "n", text: fmt(p.bytes) }),
              $("td", {}, $("button", { class: "gh", text: "Delete", onclick: async () => {
                try { await api("deleteProject", { token, projectId: p.id }); await refresh(); } catch (e) { fail(e); }
              } })),
            )),
          )
        : $("p", { class: "hint", text: "No projects yet." }),
      $("div", { class: "row", style: "margin-top:10px" },
        $("button", { class: "gh", text: "Destroy the whole bucket (DSD)", onclick: async () => {
          try { await api("destroyBucket", { token }); await refresh(); } catch (e) { fail(e); }
        } }),
      ),
    ),

    $("h2", { text: "Ledger" }),
    $("div", { class: "card" }, $("div", { id: "ledger" }, $("p", { class: "hint", text: "Loading…" }))),
  );

  loadLedger();
}

async function loadLedger() {
  try {
    const rows = await api("ledger", { token, limit: 30 });
    const box = document.getElementById("ledger");
    if (!box) return;
    clear(box);
    if (!rows.length) { box.append($("p", { class: "hint", text: "Nothing yet." })); return; }
    box.append($("table", {},
      $("tr", {}, $("th", { text: "Kind" }), $("th", { text: "Tool" }), $("th", { text: "Model" }), $("th", { class: "n", text: "Raw" }), $("th", { class: "n", text: "Weighted" }), $("th", { text: "Note" })),
      ...rows.map((r) => $("tr", {},
        $("td", { text: r.kind }),
        $("td", { text: r.tool || "—" }),
        $("td", { text: r.model || "—" }),
        $("td", { class: "n", text: fmt(r.raw) }),
        $("td", { class: "n", text: fmt(r.weighted) }),
        $("td", { style: "color:var(--mu);font-size:11.5px", text: r.note || "" }),
      )),
    ));
  } catch {}
}

async function runJob() {
  const out = document.getElementById("out");
  document.getElementById("msg").textContent = "";
  try {
    const res = await api("run", {
      token,
      tool: document.getElementById("tool").value,
      projectId: document.getElementById("project").value || null,
      prompt: document.getElementById("prompt").value,
    });
    clear(out);
    out.append($("div", { class: "mono", text:
      `${res.modelLabel}${res.swapped ? " (fell back: " + res.reason + ")" : ""}\nweight ${res.weight} · raw ${res.raw} · weighted ${res.weighted}\nremaining ${fmt(res.remaining)}\n\n${res.output}` }));
    await refresh();
  } catch (e) {
    fail(e);
    if (String(e.message).includes("pool")) {
      clear(out);
      out.append($("div", { class: "row", style: "margin-top:10px" },
        $("button", { class: "am", text: "Top up $10 · 5M weighted tokens", onclick: async () => {
          try { await api("topUp", { token }); await refresh(); } catch (err) { fail(err); }
        } })));
    }
  }
}

async function newProject() {
  const title = prompt("Project name");
  if (!title) return;
  try {
    await api("createProject", { token, tool: document.getElementById("tool").value, title });
    await refresh();
  } catch (e) { fail(e); }
}

/* ------------------------------------------------------------------ boot */
(async () => {
  if (!token) return renderAuth("signup");
  try { await refresh(); } catch { setToken(null); renderAuth("signin"); }
})();
</script>
</body>
</html>
